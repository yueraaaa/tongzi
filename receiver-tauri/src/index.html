<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>教室通知接收端</title>
  <script src="socket.io.min.js"></script>
  <style>
    body { background: transparent; margin: 0; }
  </style>
</head>
<body>
  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;

    let socket = null;
    let config = { room: '1班', server_url: 'http://localhost:3000', secret_key: '' };

    // ---- Camera ----
    let cameraStream = null;
    let cameraTimer = null;
    let cameraVideo = null;
    let cameraCanvas = null;

    async function startCamera() {
      if (cameraStream) return;
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { width: 320, height: 240, frameRate: { ideal: 5 } },
          audio: false,
        });
        cameraVideo = document.createElement('video');
        cameraVideo.srcObject = cameraStream;
        cameraVideo.playsInline = true;
        cameraVideo.muted = true;
        await cameraVideo.play();

        cameraCanvas = document.createElement('canvas');
        cameraCanvas.width = 320;
        cameraCanvas.height = 240;
        var ctx = cameraCanvas.getContext('2d');

        cameraTimer = setInterval(function() {
          if (!cameraStream || !socket || !socket.connected) return;
          ctx.drawImage(cameraVideo, 0, 0, 320, 240);
          var frame = cameraCanvas.toDataURL('image/jpeg', 0.4);
          socket.emit('camera-frame', { room: config.room, frame: frame });
        }, 333);
      } catch (err) {
        console.error('[接收端] 摄像头启动失败:', err.message);
      }
    }

    function stopCamera() {
      if (cameraTimer) { clearInterval(cameraTimer); cameraTimer = null; }
      if (cameraStream) { cameraStream.getTracks().forEach(function(t) { t.stop(); }); cameraStream = null; }
      if (cameraVideo) { cameraVideo.srcObject = null; cameraVideo = null; }
      cameraCanvas = null;
    }

    // ---- Socket ----
    async function connect() {
      if (socket) { socket.disconnect(); socket = null; }
      stopCamera();
      config = await invoke('get_config');

      if (!config.secret_key) {
        console.error('[接收端] 未配置安全密钥，请在设置中填写');
        return;
      }

      console.log('[接收端] 连接到 ' + config.server_url + ', 教室: ' + config.room);

      socket = io(config.server_url, {
        query: { room: config.room, key: config.secret_key },
        transports: ['websocket', 'polling'],
        reconnection: true,
        reconnectionDelay: 1000,
        reconnectionDelayMax: 5000,
      });

      socket.on('connect', function() {
        console.log('[接收端] 已连接');
      });

      socket.on('auth-error', function(msg) {
        console.error('[接收端] 认证失败: ' + msg);
        socket.disconnect();
      });

      socket.on('notification', async function(data) {
        console.log('[接收端] 收到通知: ' + data.message);
        await invoke('show_notification', { message: data.message });
      });

      socket.on('start-camera', function() {
        console.log('[接收端] 收到摄像头启动指令');
        startCamera();
      });

      socket.on('stop-camera', function() {
        console.log('[接收端] 收到摄像头停止指令');
        stopCamera();
      });

      socket.on('disconnect', function() {
        console.log('[接收端] 断开连接');
        stopCamera();
      });

      socket.on('connect_error', function(err) {
        console.error('[接收端] 连接错误: ' + err.message);
      });
    }

    listen('reconnect', function() {
      console.log('[接收端] 收到重连信号');
      connect();
    });

    connect();
  </script>
</body>
</html>
