<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>设置</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      background: #f5f5f5; padding: 24px; color: #333;
    }
    h2 { font-size: 17px; margin-bottom: 18px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; color: #777; margin-bottom: 4px; }
    .field input {
      width: 100%; padding: 8px 12px;
      border: 1px solid #ddd; border-radius: 4px;
      font-size: 14px; outline: none;
    }
    .field input:focus { border-color: #4caf50; }
    .btns { display: flex; gap: 8px; margin-top: 20px; }
    button { padding: 8px 20px; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; }
    .btn-save  { background: #4caf50; color: #fff; }
    .btn-save:hover  { background: #43a047; }
    .btn-cancel { background: #e0e0e0; color: #333; }
    .btn-cancel:hover { background: #d0d0d0; }
    .status { margin-top: 10px; font-size: 13px; color: #4caf50; }
    .hint { font-size: 11px; color: #aaa; margin-top: 2px; }
  </style>
</head>
<body>
  <h2>接收端设置</h2>
  <div class="field">
    <label>教室名称</label>
    <input type="text" id="room" placeholder="例如：1班" />
  </div>
  <div class="field">
    <label>服务器地址</label>
    <input type="text" id="serverUrl" placeholder="http://192.168.1.100:3000" />
    <div class="hint">教师端 IP 地址 + 端口</div>
  </div>
  <div class="field">
    <label>安全密钥</label>
    <input type="password" id="secretKey" placeholder="教师端启动时显示的密钥" />
    <div class="hint">在教师端启动时的控制台输出中可找到</div>
  </div>
  <div class="btns">
    <button class="btn-save" id="saveBtn">保存并重连</button>
    <button class="btn-cancel" onclick="window.__TAURI__.window.getCurrent().close()">取消</button>
  </div>
  <div class="status" id="status"></div>

  <script>
    var invoke = window.__TAURI__.core.invoke;

    invoke('get_config').then(function(config) {
      document.getElementById('room').value = config.room || '';
      document.getElementById('serverUrl').value = config.server_url || '';
      document.getElementById('secretKey').value = config.secret_key || '';
    });

    document.getElementById('saveBtn').addEventListener('click', async function() {
      var room = document.getElementById('room').value.trim();
      var serverUrl = document.getElementById('serverUrl').value.trim();
      var secretKey = document.getElementById('secretKey').value.trim();
      if (!room || !serverUrl || !secretKey) {
        document.getElementById('status').textContent = '请填写所有字段';
        return;
      }
      await invoke('save_config', { room: room, serverUrl: serverUrl, secretKey: secretKey });
      document.getElementById('status').textContent = '已保存，正在重连...';
      setTimeout(function() {
        window.__TAURI__.window.getCurrent().close();
      }, 800);
    });
  </script>
</body>
</html>
